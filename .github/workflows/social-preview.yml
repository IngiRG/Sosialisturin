name: Generate social preview image
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_social_preview.py'
      - 'public/favicon.svg'
      - '.github/workflows/social-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original Georgia font and image libraries
        run: |
          sudo apt-get update
          echo 'ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true' | sudo debconf-set-selections
          sudo apt-get install -y ttf-mscorefonts-installer fontconfig
          fc-match -f '%{family}\n' Georgia | grep -ix 'Georgia'
          pip install pillow cairosvg cairosvg
      - run: python scripts/generate_social_preview.py
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/social-preview.png
          git diff --cached --quiet || (git commit -m "Generate social preview PNG" && git push)
